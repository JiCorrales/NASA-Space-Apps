<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
      /* Same rule as web/src/styles.css, so the canvas fills the window before the page stylesheet arrives. */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 color: #9fb3c8; font: 14px monospace; pointer-events: none; }
    </style>
    <!-- The React page, built from web/ and copied here as page/ by the build (see CONTRIBUTING, Builds). -->
    <link rel="stylesheet" href="page/assets/page.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="root"></div>
    <div id="loading">Loading 0%</div>
    <script>
      // Tells the page it runs over Unity: it then never uses its stand-in or shows the developer bar, and draws the
      // loading and failure screens from window.__unityStatus (see web/src/bridge/engine.ts).
      window.__unityBuild = true;
      window.__unityStatus = { phase: "loading", progress: 0 };
      function setStatus(phase, progress) {
        window.__unityStatus = { phase: phase, progress: progress };
        window.dispatchEvent(new Event("unitystatus"));
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };
      var loader = document.createElement("script");
      loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      loader.onload = function () {
        createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
          var loading = document.querySelector("#loading");
          // The progress reaches 1 when the downloads end; Unity may still need a long time to start.
          if (loading) loading.textContent = progress >= 1 ? "Starting the game engine..." : "Loading " + Math.round(progress * 100) + "%";
          setStatus(progress >= 1 ? "starting" : "loading", progress);
        }).then(function (instance) {
          var loading = document.querySelector("#loading");
          if (loading) loading.remove();
          window.unityInstance = instance;
          window.__unityStatus = { phase: "ready", progress: 1 };
          window.dispatchEvent(new Event("unityready"));
        }).catch(function (message) {
          var loading = document.querySelector("#loading");
          if (loading) loading.textContent = "Could not start the game: " + message;
          setStatus("failed", 0);
        });
      };
      // The script file itself may not load (blocked, offline): that is a failure too.
      loader.onerror = function () { setStatus("failed", 0); };
      document.body.appendChild(loader);
    </script>
    <script type="module" src="page/assets/page.js"></script>
  </body>
</html>
